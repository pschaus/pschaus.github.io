    <div class="content-section-b">

        <div class="container">

            <hr class="section-heading-spacer">
            <div class="clearfix"></div>
            <h2 class="section-heading">Performance Profile Builder</h2>

            <div class="row">
            <!-- Plot Options-->
            <div class="col-md-2 text-center custom-background">

                <h4> Controls </h4>
              <hr>
              <div class="btn-group">
                <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  Baseline(s) <span class="caret"></span>
                </button>
                <ul id="baselines" class="dropdown-menu">
                </ul>
              </div>
              <i class='glyphicon glyphicon-question-sign' data-toggle="tooltip" title="Baseline selection allows to set baseline set. Only elements of this set will be considered to compute the denominator in the metric ratio. For a given instance, the denominator will be the minimal value of the baseline set elements."></i>
              
              <hr>
              
              <div class="btn-group">
                <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  Label(s) <span class="caret"></span>
                </button>
                <ul id="labels" class="dropdown-menu">
                </ul>
              </div>
              <i class='glyphicon glyphicon-question-sign' data-toggle="tooltip" title="Labels selectors. An instance that is labeled with an unselected label will not be considered in the computed profile."></i>
              
              <hr>
              
              <label for="reduction-sliders">Scaling factor(s)</label>
              <i class='glyphicon glyphicon-question-sign' data-toggle="tooltip" title="A slider applies a reduction percentage to the corresponding metric component."></i> 
              
              <div id="reduction-sliders">
                
              </div>
              
              <hr>

                <label for="xscale-type-checkbox">x scale type</label>
                <input type="checkbox" id="xscale-type-checkbox" data-off-text="Log" data-on-text="Linear" unchecked>

                <hr>

                <label for="minTau">&tau;<sub>min</sub> </label>
                <input type="number" class="form-control" min="0" step=any name="minTau" id="minTau" value="1"/>
          
                <label for="maxTau">&tau;<sub>max</sub></label>
                <input type="number" class="form-control" min="0" step=any name="maxTau" id="maxTau" value="10"/>
          
              
              <hr>
              
              <label for="minBaselineMetric">Min. Baseline Metric</label>
              <i class='glyphicon glyphicon-question-sign' data-toggle="tooltip" title="The instance with a baseline time lower than this value will be filtered out before constructing the profiles."></i> 
              <input type="number" class="form-control" min="0" step=any name="minBaselineMetric" id="minBaselineMetric" value="1000"/>

              <hr>
              
              <label for="minUnsolvedMetric">Min. Unsolved Metric</label>
              <i class='glyphicon glyphicon-question-sign' data-toggle="tooltip" title="Value used as a minimum metric to state an instance is not solved. An instance is considered unsolved by an approach if its metric is larger than this value."></i> 
              <input type="number" class="form-control" min="0" step=any name="minUnsolvedMetric" id="minUnsolvedMetric" value="1000000"/>
            
            </div>
            <div class="col-md-10" id="chart">
                <div class="row">
                    <div id="chart">
                        <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" style="height:540px"></svg>
                    </div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-md-3 col-md-offset-7">
                        <input type="file" name="jsonInputFile" id="jsonInputFile" accept=".json" data-show-remove="false" data-show-preview="false" data-show-upload="false" multiple=false data-show-caption="true" class="file-loading"/>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-default" onclick="savePlots()">
                            <span class="glyphicon glyphicon-save" aria-hidden="true"></span> Download
                        </button>
                    </div>
                </div>
            </div>
